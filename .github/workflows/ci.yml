name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { spark: '2.4.8', scala: '2.12.21', java: '8' }
          - { spark: '3.4.4', scala: '2.12.21', java: '11' }
          - { spark: '3.5.9', scala: '2.12.21', java: '11' }
          - { spark: '4.2.0', scala: '2.13.18', java: '17' }
    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }} / JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test
        env:
          SPARK_VERSION: ${{ matrix.spark }}
        run: |
          if [ "$SPARK_VERSION" = '3.4.4' ]; then
            sbt '++${{ matrix.scala }}' coverage test coverageReport
          else
            sbt '++${{ matrix.scala }}' test
          fi
